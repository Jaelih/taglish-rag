name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test-and-smoke-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run unit tests
        run: uv run pytest tests/ -v

      - name: 20-question smoke retrieval eval (BM25, no model downloads)
        run: |
          uv run python -m taglish_rag.eval.runner \
            --mode bm25 --limit 20 --label ci_smoke

      - name: Upload smoke eval results
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-eval-results
          path: results/retrieval_ci_smoke.json
