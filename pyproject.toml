[project]
name = "taglish-rag"
version = "0.1.0"
description = "Taglish-RAG: A Retrieval & Evaluation Benchmark for Code-Switched Filipino QA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "tqdm>=4.66",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pypdf>=4.2",
    "pdfplumber>=0.11",
    "rank_bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "tiktoken>=0.7",
    "langdetect>=1.0.9",
    "python-dotenv>=1.0",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "google-genai>=1.0",
    "gradio>=4.40",
    "supabase>=2.6",
    "psycopg2-binary>=2.9",
    "datasets>=2.20",
    "huggingface-hub>=0.24",
    # MarianTokenizer (opus-mt translation ablation) has no fast/tokenizers
    # variant -- without sentencepiece transformers drops the class from the
    # AutoTokenizer registry and fails with a confusing "unrecognized config".
    "sentencepiece>=0.2",
    "torch==2.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# GPU acceleration: pin torch to the exact version pytorch.org's CUDA wheel
# channel publishes (their cu128 index lags behind PyPI's plain "torch",
# which resolves to a newer CPU-only build otherwise -- see docs/RESUME_BULLETS.md
# / README limitations for why this needed pinning rather than a version range).
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taglish_rag"]
